name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: stock_user
          POSTGRES_PASSWORD: stock_password
          POSTGRES_DB: stock_analyzer
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    
    - name: Set up Python
      uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Lint with Flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Format check with Black
      run: black --check .
    
    - name: Import sorting with isort
      run: isort --check-only .
    
    - name: Run pytest
      env:
        DATABASE_URL: postgresql://stock_user:stock_password@localhost:5432/stock_analyzer
        REDIS_URL: redis://localhost:6379/0
        FLASK_ENV: testing
      run: |
        pytest --cov=. --cov-report=xml --cov-report=html
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    
    - name: Set up Python
      uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pipx
    
    - name: Run Bandit security scan
      run: |
        python -m pipx run --spec bandit==1.9.4 bandit -r . -f json -o bandit-report.json --exit-zero
        python -m pipx run --spec bandit==1.9.4 bandit -r . --severity-level low --confidence-level low
    
    - name: Check dependencies with pip-audit
      run: python -m pipx run --spec pip-audit==2.10.1 pip-audit -r requirements.txt

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    permissions:
      contents: read
      packages: write
    
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2
    
    - name: Log in to Container Registry
      if: vars.ENABLE_IMAGE_PUSH == 'true'
      uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc # v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      if: vars.ENABLE_IMAGE_PUSH == 'true'
      id: meta
      uses: docker/metadata-action@818d4b7b91585d195f67373fd9cb0332e31a7175 # v4
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=sha
    
    - name: Build Docker image locally
      if: vars.ENABLE_IMAGE_PUSH != 'true'
      uses: docker/build-push-action@0a97817b6ade9f46837855d676c4cca3a2471fc9 # v4
      with:
        context: .
        load: true
        tags: ${{ env.IMAGE_NAME }}:ci

    - name: Build and push Docker image
      if: vars.ENABLE_IMAGE_PUSH == 'true'
      uses: docker/build-push-action@0a97817b6ade9f46837855d676c4cca3a2471fc9 # v4
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' && vars.ENABLE_IMAGE_PUSH == 'true' && vars.ENABLE_STAGING_DEPLOY == 'true'
    
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    
    - name: Deploy to staging environment
      run: |
        echo "Deploying to staging environment..."
        # Add your staging deployment commands here
        # Example: kubectl apply -f k8s/staging/
        # Or: docker compose -f docker-compose.staging.yml up -d

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && vars.ENABLE_IMAGE_PUSH == 'true' && vars.ENABLE_PRODUCTION_DEPLOY == 'true'
    
    environment:
      name: production
    
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    
    - name: Deploy to production environment
      run: |
        echo "Deploying to production environment..."
        # Add your production deployment commands here
        # Example: kubectl apply -f k8s/production/
        # Or: docker compose -f docker-compose.prod.yml up -d
      env:
        # Add production environment variables as secrets in GitHub
        DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}

  notify-pr:
    name: Notify PR Completion
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.event_name == 'pull_request' && !cancelled()

    steps:
    - name: Determine build status
      id: status
      run: |
        if [ "${{ needs.test.result }}" = "failure" ] || \
           [ "${{ needs.security-scan.result }}" = "failure" ]; then
          echo "status=failed" >> $GITHUB_OUTPUT
        else
          echo "status=success" >> $GITHUB_OUTPUT
        fi

    - name: Notify Slack (optional)
      if: always() && secrets.SLACK_WEBHOOK != ''
      uses: 8398a7/action-slack@77eaa4f1c608a7d68b38af4e3f739dcd8cba273e # v3.19.0
      with:
        status: ${{ steps.status.outputs.status }}
        text: 'Build and Test Pipeline: ${{ steps.status.outputs.status }}'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

  notify-push:
    name: Notify Push Completion
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.event_name == 'push' && !cancelled()
    
    steps:
    - name: Determine build status
      id: status
      run: |
        if [ "${{ needs.test.result }}" = "failure" ] || \
           [ "${{ needs.security-scan.result }}" = "failure" ]; then
          echo "status=failed" >> $GITHUB_OUTPUT
        else
          echo "status=success" >> $GITHUB_OUTPUT
        fi
    
    - name: Notify Slack (optional)
      if: always() && secrets.SLACK_WEBHOOK != ''
      uses: 8398a7/action-slack@77eaa4f1c608a7d68b38af4e3f739dcd8cba273e # v3.19.0
      with:
        status: ${{ steps.status.outputs.status }}
        text: 'Build and Test Pipeline: ${{ steps.status.outputs.status }}'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
